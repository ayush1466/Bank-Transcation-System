<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger — Bank</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes
      // the wrong colours. Mirrors ThemeContext's initialTheme() — light is
      // the default, dark only when the user has explicitly chosen it.
      (function () {
        try {
          var dark = localStorage.getItem("ledger-theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage blocked — the light default already applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
